    - data:
        code: "import re\n\ndef main(plan: str, budget: str, travel_dates: str = \"\
          \", companions: str = \"\") -> dict:\n    plan = plan or \"\"\n    errors\
          \ = []\n    warnings = []\n\n    if len(plan.strip()) < 100:\n        errors.append(\"\
          行程内容过短或为空\")\n\n    for section in [\"行程概览\", \"每日行程\", \"预算估算\"]:\n   \
          \     if section not in plan:\n            warnings.append(\"缺少：\" + section)\n\
          \n    try:\n        budget_value = float(budget)\n    except:\n        budget_value\
          \ = 0\n\n    amounts = re.findall(\n        r\"(?:合计|总计|总预算)[^0-9]{0,20}([0-9]+(?:\\\
          .[0-9]+)?)\",\n        plan\n    )\n\n    total = 0\n    if amounts:\n \
          \       try:\n            total = float(amounts[-1])\n            if budget_value\
          \ > 0 and total > budget_value:\n                errors.append(\n      \
          \              \"预计总费用 %.0f 元超过预算 %.0f 元\"\n                    % (total,\
          \ budget_value)\n                )\n        except:\n            warnings.append(\"\
          预算合计无法解析\")\n    else:\n        warnings.append(\"未找到预算合计\")\n\n    if errors:\n\
          \        status = \"需要修正\"\n    else:\n        status = \"校验通过\"\n\n   \
          \ # 必须返回名为 result 的字段\n    return {\n        \"result\": status\n    }"
